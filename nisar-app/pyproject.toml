[project]
name = "nisar-canopy-backend"
version = "0.1.0"
description = "NISAR Canopy: FastAPI backend and job queue"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "psutil>=7.0,<8.0",
    "httpx2>=2.16,<2.17",
]

[tool.uv]
# Se ejecuta con --app-dir; no hace falta instalarlo como paquete.
package = false
