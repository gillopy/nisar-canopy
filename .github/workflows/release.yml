name: release

# Un tag vX.Y.Z hace tres cosas: construye la imagen, la publica en GitHub
# Container Registry y crea el release con las notas del rango de commits.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # crear el release
  packages: write   # publicar en ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagen:
    name: Imagen en ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=NISAR Canopy
            org.opencontainers.image.description=Consola de radar NISAR para medir cambios en la superficie
            org.opencontainers.image.licenses=MIT

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM y procedencia: la imagen se puede auditar y se sabe con que se armo.
          sbom: true
          provenance: true

  release:
    name: Notas del release
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "NISAR Canopy ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Imagen publicada: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`

          Cómo correrla (Docker Desktop o Docker Engine):

          1. Abrí una terminal en una carpeta de trabajo y reemplazá las dos rutas por
             carpetas reales de tu equipo:

          \`\`\`bash
          docker run --rm -p 127.0.0.1:8010:8010 \\
            -v /ruta/a/los/h5:/data/nisar \\
            -v /ruta/a/artefactos:/app/nisar-app/var/media \\
            ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}
          \`\`\`

          2. Abrí http://127.0.0.1:8010 en el navegador. La app no abre el navegador
             sola y la terminal queda ocupada (agregá -d para correrla en segundo plano).

          Opcional: para bajar los .h5 hace falta Earthdata. Creá un archivo .env con
          EARTHDATA_USER y EARTHDATA_PASSWORD y agregá --env-file .env al comando. Sin
          credenciales, la búsqueda de escenas y las imágenes browse funcionan igual.

          Datos: NASA/ISRO NISAR (ASF DAAC), ESA Copernicus Sentinel-2.
          Proyecto de participantes del NASA Space Apps Challenge; no es un producto de NASA."
