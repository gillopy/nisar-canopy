[project]
name = "nisar-canopy"
version = "0.1.0"
description = "NISAR Canopy: radar pipeline (GCOV, SME2, GUNW)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.34,<2.35",
    "numpy>=2.5,<2.6",
    "pillow>=13.0,<13.1",
    "matplotlib>=3.11,<3.12",
    "h5py>=3.16,<3.17",
    "pyproj>=3.8,<3.9",
    "tifffile>=2026.11,<2027",
    "rasterio>=1.5,<1.6",
    "pystac-client>=0.9,<0.10",
    "planetary-computer>=1.0,<2.0",
]

[tool.uv]
# No es un paquete instalable: solo agrupa las dependencias del pipeline.
package = false
